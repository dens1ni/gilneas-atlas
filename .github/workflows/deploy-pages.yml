name: Deploy Gilneas Atlas
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: gilneas-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Check module syntax and site files
        run: |
          # Keep deployment bounded; the full npm test suite remains available separately.
          if test -f tests/model.test.mjs; then
            node --test --test-concurrency=1 tests/model.test.mjs tests/authored-v7-migration.test.mjs tests/authored-v7-properties.test.mjs tests/authored-v8-positions.test.mjs
          fi
          npm run check
          test -s index.html
          test -s assets/data/atlas.json
          test -s assets/maps/gilneas-origins-enhanced.webp
          test -s assets/maps/origins-inactive-mist.webp
          node --input-type=module -e "import fs from 'node:fs';const files=JSON.parse(fs.readFileSync('assets/runtime-manifest.json','utf8'));for(const file of files)if(!fs.existsSync(file))throw new Error('Missing runtime path: '+file);"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare static publish root
        run: |
          mkdir -p _site
          cp index.html .nojekyll README.md package.json _site/
          cp -R assets _site/assets
          mkdir -p _site/.github/workflows _site/assets/export
          cp .github/workflows/deploy-pages.yml _site/.github/workflows/
          cp .github/workflows/deploy-pages.yml _site/assets/export/deploy-pages.yml
          rm -f _site/assets/maps/processing-preview.jpg _site/assets/maps/origins-processing-preview.jpg
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
